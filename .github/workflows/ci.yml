name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Package only the site files, so the artifact that was tested is the one deployed.
      # __SITE_URL__ becomes the Pages address (https://<owner>.github.io[/<repo>]); set the SITE_URL
      # repository variable to override it, e.g. when hosting elsewhere.
      - name: Assemble site
        id: assemble
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "$owner.github.io" ]; then default="https://$owner.github.io"; else default="https://$owner.github.io/$repo"; fi
          url="${SITE_URL:-$default}"
          url="${url%/}"
          mkdir -p _site
          cp -r index.html 404.html sample-audit.html robots.txt sitemap.xml .nojekyll assets _site/
          sed -i "s#__SITE_URL__#$url#g; s#__LASTMOD__#$(date -u +%F)#g" _site/*.html _site/robots.txt _site/sitemap.xml
          if grep -rl '__SITE_URL__\|__LASTMOD__' _site; then echo "Unreplaced placeholder" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Site URL: $url"
      # Keep placeholders and unconfirmed drafts from ever going live: the GitHub placeholder,
      # TODO markers (prices, availability, results) and case studies still marked data-draft.
      - name: Check placeholders and drafts are filled in
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rn 'your-username\|TODO:\|data-draft' _site --include='*.html'; then
            echo "::error::Fill in the TODO markers and confirm the data-draft case studies in index.html before deploying."
            exit 1
          fi
      # Broken links fail the build. The site's own absolute URLs are skipped (they only exist after deploy).
      # --index-files resolves directory links like ./#contact to index.html, as Pages does.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments --index-files index.html
            --exclude '^${{ steps.assemble.outputs.url }}'
            --exclude 'github\.com/your-username'
            '_site/**/*.html'
          fail: true
      # Lighthouse budgets for performance, accessibility, best practices and SEO (see lighthouserc.json).
      # Run with npx rather than installed: its dependency tree carries audit warnings that never reach the site.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/reports/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
