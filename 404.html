<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Served by GitHub Pages for any missing path, so links use the absolute __SITE_URL__ that CI fills in. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Page not found | Greenbar Quality Engineering</title>
<link rel="icon" href="__SITE_URL__/assets/favicon.svg" type="image/svg+xml">
<style>
:root { --paper: #f6f8f7; --ink: #15201d; --muted: #56645f; --pass: #0d7a55; --fail: #b8392a; --term-bg: #13201c; --term-fg: #d6e5df; --term-pass: #5fd3a2; --term-fail: #ff8a75; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #0f1614; --ink: #e4ece9; --muted: #9aaba5; --pass: #4cc795; --fail: #ff8a75; --term-bg: #0a100e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 16px; background: var(--paper); color: var(--ink); font: 1rem/1.6 "Segoe UI", system-ui, sans-serif; }
main { max-width: 36rem; width: 100%; }
pre { margin: 0 0 2rem; padding: 1rem 1.2rem; border-radius: 8px; background: var(--term-bg); color: var(--term-fg); font: 0.9rem/1.7 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
pre .x { color: var(--term-fail); }
pre .d { color: #8fa39b; }
h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.15; margin: 0 0 0.8rem; }
p { margin: 0 0 1.6rem; color: var(--muted); }
a.btn { display: inline-block; padding: 0.75rem 1.2rem; border-radius: 6px; background: var(--pass); color: #fff; font-weight: 600; text-decoration: none; }
@media (prefers-color-scheme: dark) { a.btn { color: #0a100e; } }
a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<pre><span class="d">$</span> npx playwright test this-page.spec.ts
<span class="x">  ✗ expect(page).toExist()</span>
<span class="d">    Received: 404 Not Found</span></pre>
  <h1>This page failed its test.</h1>
  <p>The link may be old or mistyped. Everything about the services, process and pricing is on the home page.</p>
  <a class="btn" href="__SITE_URL__/">Back to the home page</a>
</main>
</body>
</html>
